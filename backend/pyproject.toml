# 백엔드 개발 도구 설정(ruff·mypy). 패키지 빌드 설정은 두지 않는다 —
# 이 저장소는 backend/를 애플리케이션으로 실행할 뿐 배포 패키지로 만들지 않는다.

[tool.ruff]
# 이 저장소의 실제 스타일에 맞춘 한도. 한글 설명 주석이 길어 88·100은 과하게 걸린다
# (120 기준 위반 9건, 100 기준 57건). 새 코드도 120 안에서 쓴다.
line-length = 120
target-version = "py312"
# ruff는 Markdown 안의 python 코드 블록도 포맷 대상으로 본다. 문서 서술은 사람이
# 쓴 그대로 두어야 하므로 .md는 제외한다(notebooks도 분석용이라 게이트 밖).
extend-exclude = [".venv", "notebooks", "*.md"]

[tool.ruff.lint]
# E/F(pycodestyle·pyflakes)는 기본, I(import 정렬)·UP(파이썬 버전 현대화)·
# B(bugbear, 실수하기 쉬운 패턴)까지 켠다.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # B905(zip strict=)는 런타임 의미를 바꾼다 — 길이가 다르면 조용한 절단 대신 예외가 된다.
    # 각 호출부가 길이 일치를 보장하는지 따로 확인해야 하므로 이 게이트 작업에서 분리한다.
    "B905",
    # UP042(str,Enum → StrEnum)도 의미가 바뀐다 — StrEnum은 str()이 값("ok")을 주고
    # (str, Enum)은 이름("SemanticReason.OK")을 준다. query_semantic.SemanticReason은
    # 로그·JSON 직렬화 동작을 docstring으로 명시해 두었으므로 임의로 바꾸지 않는다.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI는 의존성·파라미터를 기본 인자에 두는 것이 정상 사용법이다.
# B008(function-call-in-default-argument)이 여기서는 오탐이라 예외로 둔다.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# 테스트는 한글 함수명과 긴 픽스처 리터럴을 쓴다.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
# 테스트 루트를 여기에 고정한다. CI가 tests/unit·tests/integration을 하나씩 나열하면
# 새 하위 폴더(tests/e2e 등)나 tests/ 바로 아래 파일이 조용히 실행에서 빠진다 —
# "테스트는 있는데 CI가 안 돌리는" 상태를 구조적으로 막기 위한 설정이다.
testpaths = ["tests"]
# 느린 테스트를 매 실행 로그에 남긴다. 이게 없으면 "CI가 왜 이렇게 오래 도는가"를
# 물을 때마다 로그 타임스탬프를 손으로 재게 된다 — 실제로 한 번 그렇게 쟀고,
# 그때 테스트 하나가 스위트의 75%를 쓰고 있었다(docs/backend/query-load-profile.md).
# 상위 15개면 그런 쏠림이 바로 드러난다.
addopts = "--durations=15"

[tool.mypy]
python_version = "3.12"
files = ["app"]
# 점진 도입 — 지금은 "명백한 오류만" 잡는다. 타입 힌트가 없는 함수는 검사하지 않는다.
# 커버리지를 넓히려면 disallow_untyped_defs를 모듈 단위로 켜 나간다.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
