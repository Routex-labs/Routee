name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      # 공급망 보호: 액션을 이동 가능한 태그(@v4)가 아니라 커밋 SHA로 고정한다.
      # 주석의 태그는 사람이 읽기 위한 것이고, 실제 당겨오는 것은 SHA다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build deps
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev xvfb

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter analyze
      # 테스트는 `test/` 한 곳에 있고 `lib/`의 디렉터리 구조를 그대로 미러한다.
      # 예전에는 `tests/unit_test/`에 83개가 평면으로 쌓여 있고 `test/`가 따로
      # 있었는데, CI가 `tests/`만 돌려서 `test/` 아래 337개가 한 번도 실행되지
      # 않은 적이 있다. 한 곳으로 합쳐 그 사고가 다시 나지 않게 한다.
      - run: flutter test test/
      # 통합 테스트는 **파일마다 따로** 돌린다. 한 번에 두 개 이상을 주면 두 번째
      # 앱 실행이 "Error waiting for a debug connection"으로 죽는다 — 데스크톱
      # 디바이스가 앱을 연속으로 다시 띄우지 못한다(linux·windows 양쪽 재현).
      # 파일을 나열하지 않고 glob으로 도는 이유는, 나열하면 새 파일이 조용히
      # 빠지기 때문이다. 위 `test/` 한 곳으로 합친 것과 같은 이유다.
      - run: |
          for f in integration_test/*_test.dart; do
            echo "::group::$f"
            xvfb-run -a flutter test "$f" -d linux
            echo "::endgroup::"
          done
